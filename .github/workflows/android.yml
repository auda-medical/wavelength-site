# Builds the Google Play bundle (.aab) and a signed .apk for direct installs, for the Wavelength app in mobile/.
# The logbook ships inside the app: the workflow runs the tests, builds the site, then assembles mobile/www.
# Run it from GitHub: Actions > Android app > Run workflow. The signed files appear under the run's Artifacts.
# Secrets (Settings > Secrets and variables > Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Optional PLAY_SERVICE_ACCOUNT_JSON uploads to the internal testing track
# once the first bundle has been uploaded by hand in Play Console.
name: Android app
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name shown in the store, for example 1.0.0
        required: true
        default: 1.0.0
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Worker and app tests
        working-directory: .
        run: npm test
      - run: npm ci
      - name: Build the logbook bundle (mobile/www)
        run: node scripts/build-www.mjs
      - run: npx cap sync android
      - name: Build signed bundle
        env:
          WL_VERSION_NAME: ${{ inputs.version }}
          WL_VERSION_CODE: ${{ github.run_number }}
          WL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export WL_KEYSTORE="$RUNNER_TEMP/upload.jks"
          cd android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wavelength-android-${{ inputs.version }}-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Upload to Play internal testing
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.co.thewavelength.app
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
