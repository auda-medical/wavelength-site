<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="The move: from the subcostal four-chamber view, rotate the probe 90 degrees so the marker points to the head, and tilt slightly to the patient's right while keeping the right atrium in view.">
<title>The move: from the subcostal four-chamber view, rotate the probe 90 degrees so the marker points to the head, and tilt slightly to the patient's right while keeping the right atrium in view.</title><defs>
  <filter id="sp" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55 1.25" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1" result="g"/>
    <feComposite in="g" in2="SourceGraphic" operator="arithmetic" k1="2.1" k2="0" k3="0" k4="0" result="m"/>
    <feGaussianBlur in="m" stdDeviation="0.7"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A7F8A"/></marker>
  <marker id="ahl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7FC4CC"/></marker>
</defs>
<rect width="1200" height="750" fill="#F7F5F0"/>

<g fill="none" stroke="#0F1E33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M330 70 C320 200 300 400 326 650"/><path d="M870 70 C880 200 900 400 874 650"/>
  <path d="M340 230 C430 300 520 330 600 250 C680 330 770 300 860 230" stroke-width="2.5" opacity=".5"/>
  <path d="M600 180 V250" stroke-width="2.5" opacity=".5"/>
  <circle cx="600" cy="560" r="7" stroke-width="2.5" opacity=".5"/>
  <path d="M600 250 V700" stroke-dasharray="2 10" stroke-width="2.5" opacity=".4"/>
</g>
<g transform="translate(600 330) rotate(90)" opacity=".45">
  <rect x="-22" y="-62" width="44" height="124" rx="12" fill="none" stroke="#0F1E33" stroke-width="3" stroke-dasharray="7 7"/>
  <rect x="-16" y="-58" width="32" height="10" rx="3" fill="none"/>
  <circle cx="0" cy="-74" r="7" fill="#2A7F8A"/>
</g>
<g transform="translate(570 345) rotate(0)" >
  <rect x="-22" y="-62" width="44" height="124" rx="12" fill="#0F1E33" stroke="#0F1E33" stroke-width="3" />
  <rect x="-16" y="-58" width="32" height="10" rx="3" fill="#7FC4CC"/>
  <circle cx="0" cy="-74" r="7" fill="#2A7F8A"/>
</g>
<path d="M700 300 A108 108 0 0 0 600 220" fill="none" stroke="#2A7F8A" stroke-width="4" marker-end="url(#ah)"/>
<g transform="translate(40 36)"><rect width="148" height="40" rx="20" fill="#0F1E33"/><text x="74" y="26.5" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#F7F5F0">THE MOVE</text></g>
<text x="930" y="230" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F1E33">Start in the subcostal</text>
<text x="930" y="262" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#3C4A5E">view, right atrium</text>
<text x="930" y="290" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#3C4A5E">in the centre.</text>
<text x="930" y="370" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F1E33">Rotate 90°, marker</text>
<text x="930" y="402" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#3C4A5E">to the head.</text>
<text x="930" y="482" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F1E33">Tilt slightly to the</text>
<text x="930" y="514" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#3C4A5E">patient's right.</text>
<text x="930" y="544" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#3C4A5E">Keep the atrium in view.</text>
<text x="70" y="300" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#3C4A5E">Dashed: subcostal</text>
<text x="70" y="326" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#3C4A5E">view (start)</text>
<text x="70" y="380" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F1E33">Solid: rotated,</text>
<text x="70" y="406" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F1E33">marker up (finish)</text>
<text x="600" y="175" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#3C4A5E">Xiphoid</text>
<text x="625" y="566" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#3C4A5E">Umbilicus</text>
<text x="1160" y="720" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" letter-spacing="1" fill="#8A94A3">Schematic · front of abdomen, patient supine</text>
</svg>