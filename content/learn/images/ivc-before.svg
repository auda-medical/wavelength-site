<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Before: a thick-walled tube with a branch running forwards, stopping short of the heart. This is the aorta, not the inferior vena cava.">
