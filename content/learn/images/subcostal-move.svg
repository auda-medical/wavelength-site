<g transform="translate(660 368) rotate(0)" opacity=".5">
  <path d="M-20 0 Q0 10 20 0 L16 -120 Q0 -130 -16 -120 Z" fill="none" stroke="#0F1E33" stroke-width="3" stroke-dasharray="7 7"/>
</g>
