  <path d="M-20 0 Q0 10 20 0 L16 -120 Q0 -130 -16 -120 Z" fill="#0F1E33" stroke="#0F1E33" stroke-width="3" />
</g>
<g transform="translate(640 370) rotate(-72)">
  <path d="M8 -40 C40 -40 66 -60 70 -100 C74 -140 56 -168 26 -170 C10 -170 6 -150 8 -130 Z" fill="#EDEAE3" stroke="#0F1E33" stroke-width="3" stroke-linejoin="round"/>
  <path d="M30 -60 C44 -74 52 -96 52 -118 M24 -86 C34 -100 38 -120 36 -140" stroke="#0F1E33" stroke-width="2" fill="none" opacity=".45" stroke-linecap="round"/>
</g>
<line x1="652" y1="378" x2="879.7616558105613" y2="410.00981322081503" stroke="#2A7F8A" stroke-width="3"  marker-end="url(#ah)"/>
<g transform="translate(40 36)"><rect width="148" height="40" rx="20" fill="#0F1E33"/><text x="74" y="26.5" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#F7F5F0">THE MOVE</text></g>
<text x="720" y="130" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F1E33">Hand on top of the probe,</text>
<text x="720" y="164" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#3C4A5E">then lay it almost flat on the skin.</text>
<text x="720" y="196" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#3C4A5E">Aim under the ribs, towards</text>
<text x="720" y="226" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#3C4A5E">the left shoulder.</text>
<text x="470" y="610" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#3C4A5E">Dashed: upright, beam goes to the spine</text>
<text x="470" y="642" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F1E33">Solid: flat, beam slides under the ribs to the heart</text>
<text x="918" y="545" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F6670">Heart</text>
<text x="1080" y="330" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#3C4A5E">Head</text>
<text x="130" y="400" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#3C4A5E">Feet</text>
<text x="692" y="330" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#3C4A5E">Xiphoid</text>
<text x="1160" y="720" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" letter-spacing="1" fill="#8A94A3">Schematic · side view, patient supine, knees bent</text>
</svg>