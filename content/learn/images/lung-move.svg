</g>
<path d="M560 318 A92 92 0 0 0 498 248" fill="none" stroke="#2A7F8A" stroke-width="4" marker-end="url(#ah)"/>
<g transform="translate(40 36)"><rect width="148" height="40" rx="20" fill="#0F1E33"/><text x="74" y="26.5" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#F7F5F0">THE MOVE</text></g>
<g>
  <text x="952" y="250" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F1E33">Turn the probe 90°</text>
  <text x="952" y="284" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#3C4A5E">so it crosses two ribs.</text>
  <text x="952" y="360" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F1E33">Marker to the head</text>
  <text x="952" y="394" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#3C4A5E">(the teal dot).</text>
  <text x="952" y="470" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F1E33">Second or third</text>
  <text x="952" y="504" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#3C4A5E">intercostal space,</text>
  <text x="952" y="534" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#3C4A5E">mid-clavicular line.</text>
</g>
<text x="80" y="300" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#3C4A5E">Dashed: along</text>
<text x="80" y="326" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#3C4A5E">the rib (before)</text>
<text x="80" y="380" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F1E33">Solid: across</text>
<text x="80" y="406" text-anchor="start" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F1E33">the ribs (after)</text>
<text x="1160" y="720" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" letter-spacing="1" fill="#8A94A3">Schematic · patient supine, front of chest</text>
</svg>