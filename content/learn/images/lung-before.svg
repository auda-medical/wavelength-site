<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Before: probe along a rib. One bright line with black shadow below it, so pleura and rib cannot be told apart.">
<title>Before: probe along a rib. One bright line with black shadow below it, so pleura and rib cannot be told apart.</title><defs>
  <filter id="sp" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55 1.25" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1" result="g"/>
    <feComposite in="g" in2="SourceGraphic" operator="arithmetic" k1="2.1" k2="0" k3="0" k4="0" result="m"/>
    <feGaussianBlur in="m" stdDeviation="0.7"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A7F8A"/></marker>
  <marker id="ahl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7FC4CC"/></marker>
</defs>
<rect width="1200" height="750" fill="#0A1526"/>

<clipPath id="fan"><path d="M330 110 H870 V690 H330 Z"/></clipPath>
<path d="M330 110 H870 V690 H330 Z" fill="#05080D"/>
<g clip-path="url(#fan)"><g filter="url(#sp)">
  <rect x="330" y="110" width="540" height="160" fill="#5E6670"/>
  <path d="M330 156 C510 150 690 164 870 156" stroke="#A9B0B8" stroke-width="5" fill="none"/>
  <path d="M330 206 C530 214 710 200 870 210" stroke="#9AA2AB" stroke-width="4" fill="none"/>
  <rect x="330" y="160" width="540" height="44" fill="#3C434C"/>
  <rect x="330" y="270" width="540" height="60" fill="#454C55"/>
  <path d="M330 334 C490 322 710 322 870 336" stroke="#F2F4F6" stroke-width="13" fill="none"/></g><g><rect x="330" y="160" width="540" height="44" fill="#C9746B" opacity=".28"/>
  <path d="M330 334 C490 322 710 322 870 336" stroke="#EDE4D0" stroke-width="15" fill="none" opacity=".55"/></g></g>
<path d="M330 110 H870 V690 H330 Z" fill="none" stroke="#24344D" stroke-width="1.5"/>
<path d="M330 334 C490 322 710 322 870 336" stroke="#FFFFFF" stroke-width="5" fill="none" filter="url(#glow)" clip-path="url(#fan)"/>
<g transform="translate(40 36)"><rect width="122" height="40" rx="20" fill="#EDEAE3"/><text x="61" y="26.5" text-anchor="middle" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#0F1E33">BEFORE</text></g>
<g font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#7FC4CC">
  <line x1="630" y1="326" x2="910" y2="280" stroke="#7FC4CC" stroke-width="1.5"/><circle cx="630" cy="326" r="4" fill="#7FC4CC"/>
  <text x="920" y="287" text-anchor="start">Bright line</text></g>
<g font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#7FC4CC">
  <line x1="750" y1="530" x2="910" y2="530" stroke="#7FC4CC" stroke-width="1.5"/><circle cx="750" cy="530" r="4" fill="#7FC4CC"/>
  <text x="920" y="537" text-anchor="start">Black below</text></g>
<g font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#7FC4CC">
  <line x1="450" y1="180" x2="290" y2="180" stroke="#7FC4CC" stroke-width="1.5"/><circle cx="450" cy="180" r="4" fill="#7FC4CC"/>
  <text x="280" y="187" text-anchor="end">Chest wall</text></g>
<text x="290" y="410" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#7FC4CC">Pleura or rib?</text>
<text x="290" y="444" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#9FB0C4">You cannot tell.</text>
<text x="1160" y="720" text-anchor="end" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" letter-spacing="1" fill="#6F7F95">Schematic · probe lying along a rib</text>
